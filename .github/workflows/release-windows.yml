name: Windows release

# Builds "Ton of Able" with MSVC, runs the unit tests and publishes an
# installer (Inno Setup) and a portable ZIP as a GitHub release when a tag such as v0.2.0 is pushed (or created by
# publishing a release on GitHub). Branch pushes build, test and keep the ZIP
# as a workflow artifact without publishing anything.
on:
  push:
    tags: ['v*']
    branches: ['feature/**', 'main']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and publish
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      TAG: ${{ github.event.inputs.tag || (github.ref_type == 'tag' && github.ref_name) || format('build-{0}', github.run_number) }}
      GH_TOKEN: ${{ github.token }}
      # The plugins (BYOD, Valhalla Supermassive) are carried over from this release.
      PLUGIN_SOURCE_RELEASE: v0.1.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --target NamTestProgram NamTestProgramTests --parallel

      - name: Unit tests
        shell: pwsh
        run: |
          & 'build/NamTestProgramTests_artefacts/Release/NamTestProgramTests.exe' | Tee-Object tests.log
          $code = $LASTEXITCODE
          $summary = Select-String -Path tests.log -Pattern 'test sections' | Select-Object -Last 1
          Write-Host "::notice title=Unit tests::$summary"
          Select-String -Path tests.log -Pattern '^!!! ' | Select-Object -First 20 | ForEach-Object { Write-Host "::error title=Test failure::$($_.Line)" }
          exit $code

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = 'dist/Ton of Able'
          New-Item -ItemType Directory -Force "$pkg/licenses" | Out-Null
          Copy-Item 'build/NamTestProgram_artefacts/Release/Ton of Able.exe' $pkg
          Copy-Item resources "$pkg/resources" -Recurse
          Copy-Item packaging/LIESMICH.txt $pkg

          # Plugins and their licences from the previous package.
          gh release download $env:PLUGIN_SOURCE_RELEASE -p '*.zip' -D previous
          7z x (Get-ChildItem previous/*.zip | Select-Object -First 1).FullName -oprevious/x -y | Out-Null
          $old = Get-ChildItem previous/x -Directory | Select-Object -First 1
          foreach ($item in 'BYOD.vst3', 'ValhallaSupermassive.vst3', 'Supermassive-Presets') {
            Copy-Item (Join-Path $old.FullName $item) $pkg -Recurse
          }
          Copy-Item (Join-Path $old.FullName 'licenses/*') "$pkg/licenses" -Recurse

          # Dragonfly Reverb (GPL-3): Hall, Room, Plate and Early Reflections as VST3.
          $dragonfly = '3.2.10'
          Invoke-WebRequest "https://github.com/michaelwillis/dragonfly-reverb/releases/download/$dragonfly/dragonfly-reverb-$dragonfly-win64.zip" -OutFile dragonfly.zip
          7z x dragonfly.zip -odragonfly -y | Out-Null
          $bundles = Get-ChildItem dragonfly -Recurse -Filter '*.vst3' | Where-Object { $_.PSIsContainer -and $_.Name -like 'Dragonfly*' }
          if ($bundles.Count -lt 4) { throw "Dragonfly: expected 4 VST3 bundles, found $($bundles.Count)" }
          foreach ($bundle in $bundles) { Copy-Item $bundle.FullName $pkg -Recurse }
          Invoke-WebRequest "https://raw.githubusercontent.com/michaelwillis/dragonfly-reverb/$dragonfly/LICENSE" -OutFile "$pkg/licenses/DragonflyReverb-GPL3.txt"
          Write-Host ("::notice title=Dragonfly Reverb::" + (($bundles | ForEach-Object Name) -join ', '))

          # Extra plugins that cannot be downloaded automatically (Valhalla's site blocks
          # scripts): every *.vst3 inside the ZIPs attached to the release "plugin-extras".
          if (gh release view plugin-extras 2>$null) {
            gh release download plugin-extras -p '*.zip' -D extras
            foreach ($archive in Get-ChildItem extras -Filter '*.zip') { 7z x $archive.FullName "-oextras/x" -y | Out-Null }
            # Top-level plugins only, not the binaries inside a .vst3 bundle.
            $extras = Get-ChildItem extras/x -Recurse -Filter '*.vst3' | Where-Object { $_.DirectoryName -notmatch '\.vst3(\\|$)' }
            foreach ($plugin in $extras) { Copy-Item $plugin.FullName $pkg -Recurse -Force }
            Write-Host ("::notice title=Plugin extras::" + (($extras | ForEach-Object Name) -join ', '))
          } else {
            Write-Host "::notice title=Plugin extras::No release 'plugin-extras' - Valhalla Freq Echo/Space Modulator not bundled"
          }

          # FFmpeg (LGPL, static) for AAC, Opus, MP3 export and audio from video files.
          $assets = gh api repos/BtbN/FFmpeg-Builds/releases/tags/latest --jq '.assets[] | .name + " " + .browser_download_url' | ForEach-Object { $_ -split ' ', 2 }
          $ffmpegUrl = $null
          for ($i = 0; $i -lt $assets.Count; $i += 2) {
            if ($assets[$i] -match '^ffmpeg-n[\d.]+-latest-win64-lgpl-[\d.]+\.zip$') { $ffmpegUrl = $assets[$i + 1] }
          }
          if (-not $ffmpegUrl) { throw 'No static win64 LGPL FFmpeg build found' }
          Write-Host "::notice::FFmpeg from $ffmpegUrl"
          Invoke-WebRequest $ffmpegUrl -OutFile ffmpeg.zip
          7z x ffmpeg.zip -offmpeg -y | Out-Null
          Copy-Item (Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName $pkg
          Copy-Item (Get-ChildItem ffmpeg -Recurse -Filter LICENSE.txt | Select-Object -First 1).FullName "$pkg/licenses/FFmpeg-LICENSE.txt"
          if (-not (Test-Path "$pkg/ffmpeg.exe")) { throw 'ffmpeg.exe missing from the package' }

          Copy-Item third_party/rubberband/COPYING "$pkg/licenses/RubberBand-GPL.txt"
          Copy-Item third_party/NeuralAmpModelerCore/LICENSE "$pkg/licenses/NeuralAmpModelerCore-MIT.txt"
          Copy-Item third_party/JUCE/LICENSE.md "$pkg/licenses/JUCE-LICENSE.md"

          $zip = "Ton-of-Able-$env:TAG-win64.zip"
          Push-Location dist
          7z a -tzip "../$zip" 'Ton of Able' | Out-Null
          Pop-Location
          "ZIP=$zip" | Out-File -Append $env:GITHUB_ENV
          # Package contents as annotations, readable without the raw log.
          $top = Get-ChildItem $pkg | ForEach-Object { '{0} ({1:N1} MB)' -f $_.Name, ((Get-ChildItem $_.FullName -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum / 1MB) }
          Write-Host ("::notice title=Package contents::" + ($top -join ', '))
          Write-Host ('::notice title=ZIP::{0} ({1:N1} MB)' -f $zip, ((Get-Item $zip).Length / 1MB))

      - name: Installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          # Inno Setup wants a numeric version; branch builds use the CMake version.
          $version = if ($env:TAG -match '^v(\d+(\.\d+){1,3})') { $Matches[1] } else { (Select-String -Path CMakeLists.txt -Pattern 'project\(NamTestProgram VERSION ([0-9.]+)').Matches[0].Groups[1].Value }
          $name = "Ton-of-Able-$env:TAG-setup"
          $source = (Resolve-Path 'dist/Ton of Able').Path
          & $iscc "/DAppVersion=$version" "/DSourceDir=$source" "/DOutputName=$name" packaging/installer/TonOfAble.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          $setup = "installer-out/$name.exe"
          "SETUP=$setup" | Out-File -Append $env:GITHUB_ENV
          Write-Host ('::notice title=Installer::{0} ({1:N1} MB, Version {2})' -f $name, ((Get-Item $setup).Length / 1MB), $version)

      - name: Keep ZIP and installer as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ton-of-Able-win64
          path: |
            ${{ env.ZIP }}
            ${{ env.SETUP }}
          retention-days: 14

      - name: Publish release
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $notes = "packaging/release-notes-$env:TAG.md"
          $notesArgs = if (Test-Path $notes) { @('--notes-file', $notes) } else { @('--generate-notes') }
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $env:SETUP $env:ZIP --clobber
          } else {
            gh release create $env:TAG $env:SETUP $env:ZIP --title "Ton of Able $env:TAG" @notesArgs --verify-tag
          }
          exit $LASTEXITCODE
